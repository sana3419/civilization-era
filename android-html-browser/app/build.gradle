plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.htmlbrowser'
    compileSdk 35                       // 当前最新稳定版 (Android 15)

    defaultConfig {
        applicationId "com.example.htmlbrowser"
        minSdk 24                       // Android 7.0
        targetSdk 35                    // 当前最新稳定版
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true                // 用 ViewBinding 访问布局，避免 findViewById 样板
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.preference:preference-ktx:1.2.1'   // 设置页
    implementation 'androidx.documentfile:documentfile:1.0.1'   // SAF 目录树访问
}
